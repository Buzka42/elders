name: uploader-windows
# Builds the Windows installer on every push that touches the uploader, or by hand.
# build.ps1 needs uploader/packaging/icon.ico in the repo.
on:
  push:
    paths:
      - "uploader/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uploader-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uploader/packaging/requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s uploader -v
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: ./uploader/packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MetaUploaderSetup
          path: uploader/packaging/dist/*.exe
          if-no-files-found: error
