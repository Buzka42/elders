name: uploader-windows
# Manual only until the artwork lands: build.ps1 needs icon.ico, which is not in the repo.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: ./uploader/packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MetaUploaderSetup
          path: uploader/packaging/dist/*.exe
          if-no-files-found: error
